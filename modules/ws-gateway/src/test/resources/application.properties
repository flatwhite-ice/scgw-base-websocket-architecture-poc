# E2E 테스트는 같은 JVM에 ws-backend를 띄우기 때문에 테스트 클래스패스에 ws-backend-core가 있다.
# 게이트웨이 컨텍스트에는 core의 AutoConfiguration(WebSocketService 등)이 붙으면 안 되므로 제외한다.
# RelayBackend는 spring.config.name을 바꿔 이 파일을 읽지 않는다. 운영 게이트웨이에는 core가 없다.
spring.autoconfigure.exclude=com.example.wspoc.wscore.WsCoreAutoConfiguration,com.example.wspoc.wscore.WsMetricsAutoConfiguration
