spring:
  application:
    name: ws-gateway
  lifecycle:
    # ws.gateway.drain.window(+ close 유예)보다 커야 drain 단계가 중간에 잘리지 않는다.
    timeout-per-shutdown-phase: 35s
  cloud:
    gateway:
      server:
        webflux:
          # 라우트 정의(RouteDefinition). 경로로 서비스를 고른다(D18). 각 서비스 안에서는 discovery로
          # Spring Cloud LoadBalancer가 인스턴스마다 upstream 목적지를 나눈다.
          # 고정 URI(ClusterIP, 실험 E3)는 `static` 프로필(application-static.yml)을 쓴다.
          # 경로가 서로 겹치지 않게 적는다(겹치면 order에 따라 결과가 바뀐다). 어느 라우트에도 맞지 않는 경로는 404다.
          # 경로는 서비스가 실제로 여는 @WsEndpoint 경로만 적는다(D24). `/**`처럼 넓게 잡으면 서비스에 없는 경로가
          # 404가 아니라 "101 뒤 1002"가 되고(SCG의 101 선응답, D14), WsAuth 라우트에서는 티켓도 소모된다.
          # 인증이 필요한 라우트에는 filters에 WsAuth를 선언한다(D20). 신원 헤더 제거와 drain 503은 전역 필터가 모든 라우트에 한다.
          routes:
            # 공개(익명) push. WsAuth가 없다. backend도 이 경로를 @WsEndpoint(auth = NONE)로 연다.
            - id: ws-backend-public
              uri: lb:ws://ws-backend
              predicates:
                - Path=/ws/public/push
            # echo/push 서비스
            - id: ws-backend
              uri: lb:ws://ws-backend
              predicates:
                - Path=/ws/echo,/ws/push
              filters:
                - WsAuth
            # 채팅 서비스
            - id: ws-chat
              uri: lb:ws://ws-chat
              predicates:
                - Path=/ws/chat
              filters:
                - WsAuth
          httpclient:
            # upstream(gateway -> ws-backend) Reactor Netty 클라이언트 튜닝.
            connect-timeout: 2000
            response-timeout: 10s
            pool:
              max-connections: 50000
              acquire-timeout: 5000
              # upstream 커넥션 풀 메트릭(reactor.netty.connection.provider.*)
              metrics: true
            websocket:
              max-frame-payload-length: 65536
    loadbalancer:
      eager-load:
        # 서비스별 LoadBalancer child context를 기동 시점에 만든다. 그러지 않으면 첫 요청 때 Netty event loop에서
        # 지연 생성되어(class 파일 파싱, BlockHound가 검출) 첫 핸드셰이크가 멈칫한다.
        clients: ws-backend, ws-chat
    discovery:
      client:
        simple:
          instances:
            ws-backend:
              - uri: http://localhost:8090
            ws-chat:
              - uri: http://localhost:8091
server:
  port: 8080
  shutdown: graceful

ws:
  gateway:
    auth:
      jwks-uri: http://localhost:8070/.well-known/jwks.json
    drain:
      window: 20s

management:
  endpoints:
    web:
      exposure:
        # 메트릭 수집(Prometheus)과 생존 확인만 연다(D27).
        include: health,prometheus
  metrics:
    tags:
      # 같은 이름의 ws.* 메트릭을 프로세스별로 구분한다.
      application: ${spring.application.name}

logging:
  level:
    # 세션 열림/종료 로그(D21). 부하 실험(E1~E5)에서는 WARN으로 끈다: 연결 단위 로그가 결과를 왜곡한다.
    #   예) --logging.level.ws.session=WARN  또는  LOGGING_LEVEL_WS_SESSION=WARN
    ws.session: INFO
