spring:
  application:
    name: ws-gateway
  lifecycle:
    # ws.gateway.drain.window(+ close 유예)보다 커야 drain 단계가 중간에 잘리지 않는다.
    timeout-per-shutdown-phase: 35s
  cloud:
    gateway:
      server:
        webflux:
          # 라우트 정의(RouteDefinition). 기본은 discovery: Spring Cloud LoadBalancer가 backend 인스턴스마다
          # upstream 목적지를 나눈다. 고정 URI(ClusterIP, 실험 E3)는 `static` 프로필(application-static.yml)을 쓴다.
          routes:
            - id: ws-backend
              uri: lb:ws://ws-backend
              predicates:
                - Path=/ws/**
          httpclient:
            # upstream(gateway -> ws-backend) Reactor Netty 클라이언트 튜닝.
            connect-timeout: 2000
            response-timeout: 10s
            pool:
              max-connections: 50000
              acquire-timeout: 5000
            websocket:
              max-frame-payload-length: 65536
    loadbalancer:
      eager-load:
        # 서비스별 LoadBalancer child context를 기동 시점에 만든다. 그러지 않으면 첫 요청 때 Netty event loop에서
        # 지연 생성되어(class 파일 파싱, BlockHound가 검출) 첫 핸드셰이크가 멈칫한다.
        clients: ws-backend
    discovery:
      client:
        simple:
          instances:
            ws-backend:
              - uri: http://localhost:8081
server:
  port: 8082
  shutdown: graceful

ws:
  gateway:
    auth:
      jwks-uri: http://localhost:8080/.well-known/jwks.json
    drain:
      window: 20s
