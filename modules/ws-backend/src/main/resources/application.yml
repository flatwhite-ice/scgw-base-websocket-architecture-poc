spring:
  application:
    name: ws-backend
  lifecycle:
    # Must exceed ws.drain.window (+ close grace) so the drain phase is not cut short.
    timeout-per-shutdown-phase: 35s
server:
  port: 8081
  shutdown: graceful

# Default = relay (architecture A): behind ws-gateway (whose default target is localhost:8081), trusting the
# X-User-Id / X-Scopes / X-Auth-Exp headers it injects. No JWKS needed.
# Must only be reachable through the gateway (K8s: NetworkPolicy) — anyone hitting it directly could spoof identity.
# Profile `direct` = architecture B (self-authenticating, :8083), can run next to this instance.
ws:
  auth:
    mode: gateway
  heartbeat:
    interval: 30s
    max-missed: 2
  drain:
    window: 20s
