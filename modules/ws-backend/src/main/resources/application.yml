spring:
  application:
    name: ws-backend
  lifecycle:
    # Must exceed ws.drain.window (+ close grace) so the drain phase is not cut short.
    timeout-per-shutdown-phase: 35s
server:
  port: 8081
  shutdown: graceful

# Defaults = direct (self-authenticating) mode against a local auth-api, so the app starts without a profile.
# Profiles: `relay` (behind ws-gateway, trusts its headers, :8081) / `direct` (self mode on :8083, next to relay).
ws:
  auth:
    mode: self
    jwks-uri: http://localhost:8080/.well-known/jwks.json
  heartbeat:
    interval: 30s
    max-missed: 2
  drain:
    window: 20s
