spring:
  application:
    name: ws-console
server:
  port: 8060

# 브라우저 테스트 콘솔(D23). 화면은 게이트웨이(relay)에 직접 WebSocket을 연다.
console:
  # 토큰/티켓 발급을 중계할 auth-api 주소(브라우저는 같은 origin만 호출하므로 auth-api에 CORS가 필요 없다)
  auth-base: http://localhost:8070
  # 화면과 probe가 연결할 게이트웨이 주소
  ws-base: ws://localhost:8080
  # probe 핸드셰이크 제한 시간
  probe-timeout: 3s
